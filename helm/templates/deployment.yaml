apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stie.fullname" . }}
  labels:
    app: {{ include "stie.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "stie.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "stie.fullname" . }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
            - containerPort: 9001
          env:
            - name: APP_DEBUG
              value: "{{ .Values.config.debug }}"
            - name: LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
            - name: P2P_ENABLED
              value: "{{ .Values.config.p2pEnabled }}"
            - name: AI_LLM_PROVIDER
              value: "{{ .Values.config.aiProvider }}"
            - name: AI_LLM_MODEL
              value: "{{ .Values.config.aiModel }}"
            - name: WEAVE_ENABLED
              value: "{{ .Values.config.weaveEnabled }}"
          resources:
            requests:
              cpu: {{ .Values.resources.api.requests.cpu }}
              memory: {{ .Values.resources.api.requests.memory }}
            limits:
              cpu: {{ .Values.resources.api.limits.cpu }}
              memory: {{ .Values.resources.api.limits.memory }}
