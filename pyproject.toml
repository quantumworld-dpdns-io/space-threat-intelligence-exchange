[build-system]
requires = ["poetry-core>=1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.packages]
find = { where = ["src"] }

[tool.poetry]
name = "space-threat-intelligence-exchange"
version = "0.1.0"
description = "Decentralized CTI sharing for satellite intrusions and GNSS spoofing via signed threat reports"
authors = ["quantumworld-dpdns-io"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
sqlalchemy = ">=2.0.0"
alembic = ">=1.12.0"
asyncpg = ">=0.28.0"
redis = ">=5.0.0"
httpx = ">=0.25.0"
cryptography = ">=41.0.0"
stix2 = ">=3.0.0"
qdrant-client = ">=1.9.0"
duckdb = ">=0.10.0"
pyarrow = ">=14.0.0"
openai = ">=1.0.0"
prometheus-client = ">=0.19.0"
typer = ">=0.9.0"
rich = ">=13.0.0"
pyyaml = ">=6.0"
python-jose = {extras = ["cryptography"], version = ">=3.3.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
python-multipart = ">=0.0.6"
jinja2 = ">=3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
hypothesis = ">=6.0"
ruff = ">=0.1.0"
mypy = ">=1.0"
pre-commit = ">=3.0"
factory-boy = ">=3.3"
faker = ">=20.0"
locust = ">=2.20.0"
robotframework = ">=7.0"
robotframework-requests = ">=0.9"
bandit = ">=1.7"
safety = ">=3.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
    "ai: AI-dependent tests",
]
