[build-system]
requires = ["poetry-core>=1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "space-threat-intelligence-exchange"
version = "0.1.0"
description = "Decentralized CTI sharing for satellite intrusions and GNSS spoofing via signed threat reports"
authors = ["quantumworld-dpdns-io"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
redis = "^5.2.0"
httpx = "^0.28.0"
cryptography = "^44.0.0"
py-libp2p = "^0.3.0"
stix2 = "^3.0.1"
taxii2-client = "^2.3.1"
qdrant-client = "^1.12.0"
chromadb = "^0.5.0"
duckdb = "^1.1.0"
pyarrow = "^18.0.0"
datafusion = "^42.0.0"
ollama = "^0.4.0"
openai = "^1.56.0"
wandb = "^0.19.0"
weave = "^0.51.0"
prometheus-client = "^0.21.0"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-instrumentation-fastapi = "^0.50b0"
typer = "^0.15.0"
rich = "^13.9.0"
pyyaml = "^6.0.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.17"
jinja2 = "^3.1.4"
numpy = "^2.1.0"
scikit-learn = "^1.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
hypothesis = "^6.119.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
factory-boy = "^3.3.1"
faker = "^33.0.0"
locust = "^2.32.0"
robotframework = "^7.1.0"
robotframework-requests = "^0.9.0"
robotframework-seleniumlibrary = "^6.6.0"
bandit = "^1.8.0"
semgrep = "^1.102.0"
safety = "^3.3.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF", "PD"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
    "ai: AI-dependent tests",
    "p2p: P2P network tests",
]
