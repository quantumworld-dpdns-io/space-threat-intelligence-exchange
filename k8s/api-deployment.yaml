apiVersion: apps/v1
kind: Deployment
metadata:
  name: stie-api
  labels:
    app: stie
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stie
      component: api
  template:
    metadata:
      labels:
        app: stie
        component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/quantumworld-dpdns-io/space-threat-intelligence-exchange:latest
          ports:
            - containerPort: 8000
            - containerPort: 9001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stie-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stie-secrets
                  key: redis-url
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: AI_LLM_API_URL
              value: http://ollama:11434
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: stie-api
spec:
  selector:
    app: stie
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: p2p
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stie-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stie-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
